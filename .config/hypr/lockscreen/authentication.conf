label {
    monitor =
    text =     $USER
    color = $foreground
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $foreground
    fade_on_empty = false
    font_size = 14
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">󰢁    Enter Password </span></i>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
}
